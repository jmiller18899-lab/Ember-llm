name: Ember Tiny Protected Overfit

on:
  push:
    branches:
      - codex/ember-tiny-lr-ladder
    paths:
      - .github/ember-tiny-protected-overfit.launch

permissions:
  contents: read

jobs:
  protected-overfit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.H_F2 }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install huggingface-hub==1.3.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Validate protected diagnostic
        run: |
          python -m py_compile jobs/ember_tiny_protected_overfit.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py
      - name: Run protected overfit diagnostic
        run: python jobs/ember_tiny_protected_overfit.py --output-dir tiny-protected-results
      - name: Publish summary
        if: always()
        run: |
          if [ -f tiny-protected-results/summary.md ]; then cat tiny-protected-results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-tiny-protected-${{ github.run_id }}
          path: tiny-protected-results/
          retention-days: 90
          if-no-files-found: warn
