name: Ember offline meaning probe
"on":
  push:
    branches: [codex/ember-next-training-20261009]
    paths: [.github/workflows/ember-meaning-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install huggingface-hub==1.31.0
      - name: Replay frozen answers with experimental checks
        env:
          HF_TOKEN: ${{ secrets.EMBER_HF_TOKEN }}
        run: python reports/probes/meaning_probe_20261009.py
