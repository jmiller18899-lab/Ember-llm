name: Ember v0.0.50 Teacher KL CPU Canary

on:
  push:
    branches: [codex/ember-v050-teacher-kl-canary]
    paths: [.github/ember-v050.launch]

permissions:
  contents: read

concurrency:
  group: ember-v050-teacher-kl-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Test teacher KL canary and inherited guards
        run: |
          python -m py_compile jobs/ember_v050_data.py jobs/ember_v050_distill.py jobs/ember_v050_canary.py jobs/ember_v049_replay.py jobs/ember_v048_value_compat.py jobs/ember_envelope_preflight_v041.py
          python -m pytest -q tests/test_ember_v050_teacher_kl.py tests/test_ember_v049_protected_replay.py tests/test_ember_v048_two_objective.py tests/test_ember_v047_envelope_template.py tests/test_ember_v046_structural_prefix.py tests/test_ember_v045_residual_logit.py tests/test_ember_v044_envelope_preflight.py tests/test_ember_v043_envelope_preflight.py tests/test_ember_v042_envelope_preflight.py tests/test_ember_v041_envelope_preflight.py tests/test_ember_v040_envelope_preflight.py tests/test_ember_v039_envelope_preflight.py tests/test_ember_v038_envelope_preflight.py tests/test_ember_v037_envelope_preflight.py tests/test_ember_v036_envelope_preflight.py tests/test_ember_v035_envelope_preflight.py tests/test_ember_v034_envelope_preflight.py
      - name: Run CPU frozen-teacher canary
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
        run: python jobs/ember_v050_canary.py --output-dir v050-results
      - name: Show summary
        if: always()
        run: |
          if [ -f v050-results/summary.md ]; then cat v050-results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v050-teacher-kl-${{ github.run_id }}
          path: |
            v050-results/report.json
            v050-results/summary.md
          if-no-files-found: warn
          retention-days: 90
