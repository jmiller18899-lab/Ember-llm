name: Ember Repair2 GGUF job log
# Read-only status for the Repair2 GGUF packaging job. Editing this file does not submit a job.
# Snapshot 3.
"on":
  workflow_dispatch:
  push:
    branches: [cursor/ember-repair2-gguf-4cca]
    paths:
      - .github/workflows/ember-repair2-gguf-log.yml
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Read packaging job status and log tail
        env:
          HF_TOKEN: ${{ secrets.EMBER_HF_TOKEN }}
          JOB_ID: 6acaaecbfee2c9007018e030
        run: |
          if [ "$JOB_ID" = "pending" ]; then
            echo "GGUF_LOG_WAITING_FOR_JOB_ID"
            exit 0
          fi
          python -m pip install -q huggingface-hub==1.31.0
          python - <<'PY'
          import os, re, time
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          jid = os.environ["JOB_ID"]
          keys = ("GGUF_", "Traceback", "Error", "Exception", "RuntimeError", "OutOfMemory", "command failed")
          def show(lines):
              clean = [re.sub(r"hf_[A-Za-z0-9]+", "[REDACTED]", str(line)) for line in lines]
              interesting = [line for line in clean if any(key in line for key in keys)]
              for line in interesting[-30:]:
                  print(line[:500], flush=True)
              return clean
          for attempt in range(20):
              info = api.inspect_job(job_id=jid)
              stage = getattr(info.status, "stage", None)
              print("JOB_POLL", attempt, stage, info.status, "started", getattr(info, "started_at", None), "finished", getattr(info, "finished_at", None), flush=True)
              if stage not in (None, "SCHEDULING", "PENDING", "STARTING"):
                  break
              time.sleep(45)
          info = api.inspect_job(job_id=jid)
          stage = getattr(info.status, "stage", None)
          lines = show(api.fetch_job_logs(job_id=jid))
          print("JOB_FOLLOW", stage, "lines", len(lines), flush=True)
          print("---- LOG TAIL ----", flush=True)
          for line in lines[-40:]:
              print(line[:400], flush=True)
          PY
