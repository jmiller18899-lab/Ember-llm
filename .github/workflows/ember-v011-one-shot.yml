name: Ember v0.0.11 One-Shot Training Launch

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read

jobs:
  launch:
    if: github.head_ref == 'training/ember-v0.0.11-launch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout launch branch
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Hugging Face Jobs client
        run: python -m pip install --upgrade 'huggingface-hub>=1.4'

      - name: Verify write-capable HF token and create private target repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)
          who = api.whoami()
          print('HF user:', who['name'])
          api.create_repo('Jmiller18899/ember-v0.0.11-t4', repo_type='model', private=True, exist_ok=True)
          print('EMBER_V011_TARGET_REPO_READY')
          PY

      - name: Confirm no v0.0.11 job already active
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          active="$(hf jobs ps --format json 2>/dev/null || true)"
          if printf '%s' "$active" | grep -q 'ember-v0-0-11-semantic-copy'; then
            echo '::error::An Ember v0.0.11 training job already appears active.'
            exit 1
          fi
          echo 'No duplicate v0.0.11 job detected.'

      - name: Launch exactly one v0.0.11 T4 corrective run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-11-semantic-copy \
            --flavor t4-small \
            --timeout 2h \
            --secrets HF_TOKEN \
            jobs/ember_hf_sft_v011_aligned.py

      - name: Launch receipt
        run: |
          echo 'EMBER_V011_GITHUB_LAUNCH=SUBMITTED'
          echo 'The training script will refuse promotion if its internal semantic smoke fails.'
