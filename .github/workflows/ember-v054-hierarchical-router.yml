name: Ember v0.0.54 Hierarchical Block-3 Router

on:
  push:
    branches:
      - codex/ember-v054-hierarchical-router
    paths:
      - jobs/ember_v054_hierarchical_router.py
      - jobs/patch_v054_hierarchical_router_summary.py
      - .github/workflows/ember-v054-hierarchical-router.yml
      - .github/ember-v054-hierarchical-router.launch
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
    steps:
      - name: Checkout hierarchical-router branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install "huggingface-hub>=1.4,<2" sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5

      - name: Apply deterministic summary-format patch
        run: python jobs/patch_v054_hierarchical_router_summary.py

      - name: Validate hierarchical router
        run: |
          python -m py_compile jobs/ember_v054_hierarchical_router.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py

      - name: Run hierarchical frozen router
        run: python jobs/ember_v054_hierarchical_router.py | tee v054-hierarchical-router.log

      - name: Write summary
        if: always()
        run: |
          if [ -f v054-hierarchical-router/summary.md ]; then
            cat v054-hierarchical-router/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v054-hierarchical-router-${{ github.run_id }}
          path: |
            v054-hierarchical-router/
            v054-hierarchical-router.log
          retention-days: 90
