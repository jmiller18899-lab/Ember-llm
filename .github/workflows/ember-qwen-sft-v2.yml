name: Ember Qwen SFT v2 preflight and capped GPU launch
# Preflight revision 3: explicit tokenizer return type and current warmup API.
on:
  push:
    branches: [codex/ember-routing-v4]
    paths: [.github/workflows/ember-qwen-sft-v2.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ember-qwen-sft-v2-single-launch
  cancel-in-progress: false
jobs:
  preflight-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU preflight dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.17.0 peft==0.20.0 trl==1.13.0 accelerate==1.15.0 huggingface-hub==1.31.0 trackio==0.37.1 datasets==5.0.1
      - name: Validate data and run hybrid-model LoRA forward and backward on CPU
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python jobs/ember_qwen_sft_v2.py --preflight
      - name: Launch at most one paid L4 job with two-hour limit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python jobs/ember_qwen_sft_submit_v2.py
      - name: Preserve preflight evidence and submission receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ember-qwen-sft-v2-launch
          path: |
            gpu-submission.json
            qwen-sft-v2-results/manifest.json
            qwen-sft-v2-results/dataset.json
