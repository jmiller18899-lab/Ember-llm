name: Ember WR10 preflight and launch
"on":
  push:
    branches: [cursor/ember-writing-repair10-9a92]
    paths:
      - .github/workflows/ember-writing-repair10.yml
      - jobs/ember_writing_repair10_data.py
      - jobs/ember_writing_repair10_train.py
      - jobs/ember_meaning_preservation_v3.py
      - jobs/wr10-20261010.launch
permissions:
  contents: read
concurrency:
  group: ember-wr10-20261010
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.EMBER_HF_TOKEN }}
      WR10_CODE_COMMIT: ${{ github.sha }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Verify keep-pass rows, v3 isolation and the real tokenizer
        run: uv run --python 3.11 jobs/ember_writing_repair10_train.py --preflight
      - name: Submit the authorized WR10 run once
        # Preflight must pass on this commit. This step submits one GPU job.
        if: contains(github.event.head_commit.message, 'Launch authorized WR10 keep-pass training')
        run: uv run --python 3.11 jobs/ember_writing_repair10_train.py --launch
