name: Retract incorrectly packaged Ember candidate

on:
  push:
    branches: [codex/ember-tool-assistant-freeze]
    paths: [.github/workflows/ember-retract-failed-prototype.yml]

permissions:
  actions: write

jobs:
  retract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove only the known failed prototype and preserve its evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/jmiller18899-lab/Ember-llm/actions/artifacts/10185693838'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(base, headers=headers)) as response:
              artifact = json.load(response)
          assert artifact['name'] == 'ember-tool-assistant-prototype-34564981796'
          assert artifact['workflow_run']['id'] == 34564981796
          assert artifact['workflow_run']['head_sha'] == '63ef6ba4b6438913f1a95a3baa33fb9128bf5c89'
          with urllib.request.urlopen(urllib.request.Request(base, headers=headers, method='DELETE')) as response:
              assert response.status == 204
          print('Retracted failed prototype artifact 10185693838. Evidence artifact 10185692097 was preserved.')
          PY
