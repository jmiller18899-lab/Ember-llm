name: Ember v0.0.54 INT4 Router-Controlled Generation

on:
  push:
    branches:
      - codex/ember-v054-int4-controlled-generation
    paths:
      - jobs/ember_v054_int4_controlled_generation.py
      - jobs/patch_v054_hierarchical_router_summary.py
      - .github/workflows/ember-v054-int4-controlled-generation.yml
      - .github/ember-v054-int4-controlled-generation.launch
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
    steps:
      - name: Checkout controlled-generation branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install "huggingface-hub>=1.4,<2" sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5
      - name: Apply deterministic hierarchical summary patch
        run: python jobs/patch_v054_hierarchical_router_summary.py
      - name: Validate controlled-generation diagnostic
        run: |
          python -m py_compile jobs/ember_v054_hierarchical_router.py
          python -m py_compile jobs/ember_v054_router_calibration.py
          python -m py_compile jobs/ember_v054_multilayer_router.py
          python -m py_compile jobs/ember_v054_int4_controlled_generation.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py
      - name: Run INT4 router-controlled generation
        run: python jobs/ember_v054_int4_controlled_generation.py | tee v054-int4-controlled-generation.log
      - name: Write summary
        if: always()
        run: |
          if [ -f v054-int4-controlled-generation/summary.md ]; then cat v054-int4-controlled-generation/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v054-int4-controlled-generation-${{ github.run_id }}
          path: |
            v054-int4-controlled-generation/
            v054-int4-controlled-generation.log
          retention-days: 90
