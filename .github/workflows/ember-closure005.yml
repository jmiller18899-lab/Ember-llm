name: Ember Punctuation 0.05 Full CPU Run

on:
  push:
    branches: [codex/ember-closure005]
    paths: [.github/ember-closure005.launch]

permissions:
  contents: read

concurrency:
  group: ember-closure005
  cancel-in-progress: false

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Verify generated-prefix closure and inherited contracts
        run: python -m pytest -q tests/test_ember_generated_closure.py tests/test_ember_json_closure.py tests/test_ember_rung0_trajectory.py tests/test_ember_first_update_diagnostic.py tests/test_ember_v050_teacher_kl.py tests/test_ember_v049_protected_replay.py
      - name: Run bounded generated-prefix JSON closure experiment
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
          PYTHONUNBUFFERED: '1'
        run: python jobs/ember_generated_closure.py --output-dir closure005-results --closing-weight 0.05 --new-holdout
      - name: Publish summary
        if: always()
        run: |
          if [ -f closure005-results/summary.md ]; then cat closure005-results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-closure005-${{ github.run_id }}
          path: closure005-results/
          if-no-files-found: warn
          retention-days: 90
