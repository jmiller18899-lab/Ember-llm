name: Ember Qwen3.5-4B conservative LoRA v1
# Uses the proven HF_2 write token, with HF_TOKEN as fallback. Preflight retry 2.
on:
  push:
    branches: [codex/ember-qwen35-4b-sft-v1]
    paths: [.github/workflows/ember-qwen35-4b-sft-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ember-qwen35-4b-sft-v1-single-launch
  cancel-in-progress: false
jobs:
  preflight-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU preflight dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.17.0 peft==0.20.0 trl==1.13.0 accelerate==1.15.0 huggingface-hub==1.31.0 trackio==0.37.1 datasets==5.0.1
      - name: Validate all data and run Qwen LoRA forward-backward on CPU
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python jobs/ember_qwen35_4b_sft_v1.py --preflight
      - name: Launch exactly one paid L4 job with two-hour cap
        env:
          HF_TOKEN: ${{ secrets.HF_2 || secrets.HF_TOKEN }}
        run: python jobs/ember_qwen35_4b_sft_submit_v1.py
      - name: Preserve preflight evidence and launch receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ember-qwen35-4b-sft-v1-launch
          path: |
            gpu-submission.json
            qwen-sft-4b-v1-results/manifest.json
            qwen-sft-4b-v1-results/dataset.json
