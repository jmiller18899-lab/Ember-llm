name: Ember WR5 copying checkpoint diagnostic

"on":
  push:
    branches: [experiment/ember-wr5-copying-investigation-20261003]
    paths: [jobs/wr5-copying-20261003.launch]

permissions:
  contents: read

concurrency:
  group: ember-wr5-copying-20261003
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.EMBER_HF_TOKEN }}
      COPY_CODE_COMMIT: ${{ github.sha }}
      TOKENIZERS_PARALLELISM: "false"
    outputs:
      job_id: ${{ steps.submit.outputs.job_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Validate original targets, loss masks and diagnostic coverage
        run: uv run --python 3.11 jobs/ember_wr5_copy_diagnostic.py --preflight
      - name: Submit one read-only checkpoint replay
        id: submit
        run: uv run --python 3.11 jobs/ember_wr5_copy_diagnostic.py --launch
  collect:
    needs: submit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.EMBER_HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Stream inference results and retrieve pinned evidence
        run: uv run --python 3.11 jobs/ember_wr5_copy_collect.py --job-id ${{ needs.submit.outputs.job_id }}
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-wr5-copying-evidence
          path: copying-saved-evidence/
          if-no-files-found: error
          retention-days: 7
