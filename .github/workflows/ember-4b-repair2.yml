name: Ember 4B repair2 successor (train + gate)
on:
  push:
    branches: [claude/new-session-tuz2t4]
    paths:
      - .github/workflows/ember-4b-repair2.yml
      - jobs/ember_4b_repair2_train.py
      - jobs/ember_4b_repair2.launch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install CPU preflight
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.17.0 peft==0.20.0 trl==1.13.0 accelerate==1.15.0 huggingface-hub==1.31.0 datasets==5.0.1 pytest
      - name: Tests
        run: python -m pytest -q tests/test_ember_4b_repair2_train.py tests/test_ember_4b_repair2_curriculum.py tests/test_ember_time_heldout_v1.py
      - name: Tokenize curriculum and validate
        run: python jobs/ember_4b_repair2_train.py --preflight
  launch:
    # Runs only once jobs/ember_4b_repair2.launch is committed; one launch per output repo.
    needs: preflight
    if: ${{ hashFiles('jobs/ember_4b_repair2.launch') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Reserve output repo and launch one capped L4 run
        env:
          HF_TOKEN: ${{ secrets.HF_2 || secrets.HF_TOKEN }}
        run: |
          python -m pip install -q huggingface-hub==1.31.0
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ["HF_TOKEN"]; api=HfApi(token=token)
          repo="Jmiller18899/ember-qwen3.5-4b-repair2"; api.create_repo(repo,private=True,exist_ok=True)
          if api.file_exists(repo,"launch.json"): raise RuntimeError("repair2 already launched")
          api.upload_file(repo_id=repo,path_in_repo="launch.json",path_or_fileobj=b'{"status":"reserved"}',commit_message="Reserve repair2 run")
          job=api.run_uv_job("jobs/ember_4b_repair2_train.py",python="3.11",flavor="l4x1",timeout=7200,name="ember-4b-repair2",secrets={"HF_TOKEN":token},env={"TOKENIZERS_PARALLELISM":"false"})
          api.upload_file(repo_id=repo,path_in_repo="launch.json",path_or_fileobj=(f'{{"status":"submitted","job_id":"{job.id}"}}').encode(),commit_message="Record repair2 job")
          print("REPAIR2_JOB",job.id,job.url)
          PY
