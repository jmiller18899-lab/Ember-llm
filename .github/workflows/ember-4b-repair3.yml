name: Ember 4B repair3 multiply-add targeted fix (train + gate)
on:
  push:
    branches: [claude/repair2-exact-regression-ftg9bz]
    paths:
      - .github/workflows/ember-4b-repair3.yml
      - jobs/ember_4b_repair3_train.py
      - jobs/ember_4b_repair3.launch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      launch: ${{ steps.marker.outputs.launch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install CPU preflight
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.17.0 peft==0.20.0 trl==1.13.0 accelerate==1.15.0 huggingface-hub==1.31.0 datasets==5.0.1 pytest
      - name: Tests
        run: python -m pytest -q tests/test_ember_4b_repair3_train.py tests/test_ember_4b_repair2_curriculum.py
      - name: Tokenize rows and validate
        run: python jobs/ember_4b_repair3_train.py --preflight
      - name: Check launch marker
        id: marker
        run: if [ -f jobs/ember_4b_repair3.launch ]; then echo launch=true; else echo launch=false; fi >> "$GITHUB_OUTPUT"
  launch-and-wait:
    # One capped L4 run per output repo; runs only once jobs/ember_4b_repair3.launch is committed.
    needs: preflight
    if: needs.preflight.outputs.launch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Reserve output repo, launch, and wait for the gate
        env:
          HF_TOKEN: ${{ secrets.HF_2 || secrets.HF_TOKEN }}
        run: |
          python -m pip install -q huggingface-hub==1.31.0
          python - <<'PY'
          import os,sys,time
          from huggingface_hub import HfApi
          token=os.environ["HF_TOKEN"]; api=HfApi(token=token)
          repo="Jmiller18899/ember-qwen3.5-4b-repair3"; api.create_repo(repo,private=True,exist_ok=True)
          if api.file_exists(repo,"launch.json"): raise RuntimeError("repair3 already launched")
          api.upload_file(repo_id=repo,path_in_repo="launch.json",path_or_fileobj=b'{"status":"reserved"}',commit_message="Reserve repair3 run")
          job=api.run_uv_job("jobs/ember_4b_repair3_train.py",python="3.11",flavor="l4x1",timeout=7200,name="ember-4b-repair3",secrets={"HF_TOKEN":token},env={"PYTHONUNBUFFERED":"1","TOKENIZERS_PARALLELISM":"false"})
          api.upload_file(repo_id=repo,path_in_repo="launch.json",path_or_fileobj=(f'{{"status":"submitted","job_id":"{job.id}"}}').encode(),commit_message="Record repair3 job")
          print("REPAIR3_JOB",job.id,job.url,flush=True)
          for _ in range(840):
              st=api.inspect_job(job_id=job.id).status
              if st.stage in ("COMPLETED","ERROR","CANCELED","DELETED"): break
              time.sleep(10)
          print("JOB_STATUS",st,flush=True)
          lines=list(api.fetch_job_logs(job_id=job.id))
          for l in lines:
              if l.startswith("REPAIR3_"): print(l)
          print("---- LOG TAIL ----")
          for l in lines[-30:]: print(l)
          sys.exit(0 if st.stage=="COMPLETED" and any(l.startswith("REPAIR3_SUMMARY") for l in lines) else 1)
          PY
