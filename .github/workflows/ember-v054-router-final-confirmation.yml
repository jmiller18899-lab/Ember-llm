name: Ember v0.0.54 Router Final Confirmation

on:
  push:
    branches:
      - codex/ember-v054-router-final-confirmation
    paths:
      - jobs/ember_v054_router_final_confirmation.py
      - .github/workflows/ember-v054-router-final-confirmation.yml
      - .github/ember-v054-router-final-confirmation.launch
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
    steps:
      - name: Checkout final-confirmation branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install "huggingface-hub>=1.4,<2" sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5
      - name: Apply inherited report-only patches
        run: |
          python jobs/patch_v054_hierarchical_router_summary.py
          python jobs/patch_v054_router_third_summary.py
      - name: Validate frozen final confirmation
        run: |
          python -m py_compile jobs/ember_v054_router_final_confirmation.py jobs/ember_v054_weather_time_specialist.py jobs/ember_v054_expanded_router.py jobs/ember_v054_hierarchical_router.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py
      - name: Run untouched 150-case final confirmation
        run: python jobs/ember_v054_router_final_confirmation.py | tee v054-router-final-confirmation.log
      - name: Write summary
        if: always()
        run: |
          if [ -f v054-router-final-confirmation/summary.md ]; then cat v054-router-final-confirmation/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v054-router-final-confirmation-${{ github.run_id }}
          path: |
            v054-router-final-confirmation/
            v054-router-final-confirmation.log
          retention-days: 90
