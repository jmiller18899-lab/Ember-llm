name: Publish Ember development snapshot
on:
  push:
    branches: [codex/ember-routing-v4]
    paths: [.github/workflows/ember-publish-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore measured CPU artifact
        uses: actions/download-artifact@v5
        with:
          artifact-ids: '10352838270'
          run-id: '34857841073'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ember-direct-artifact
      - name: Install Hub upload client
        run: python -m pip install huggingface-hub==1.31.0
      - name: Publish and verify pinned source and experimental evidence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EMBER_ARTIFACT_DIR: ${{ runner.temp }}/ember-direct-artifact
        run: python jobs/ember_publish_snapshot.py
