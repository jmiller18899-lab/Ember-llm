name: Ember v0.0.54 Bounded Routing Repair

on:
  push:
    branches:
      - codex/ember-v054-routing-repair
    paths:
      - jobs/ember_v054_routing_repair.py
      - .github/workflows/ember-v054-routing-repair.yml
      - .github/ember-v054-routing-repair.launch
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install "huggingface-hub>=1.4,<2" sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5

      - name: Validate repair diagnostic
        run: |
          python -m py_compile jobs/ember_v054_routing_repair.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py

      - name: Run bounded v0.0.54 routing repair
        run: python jobs/ember_v054_routing_repair.py | tee v054-routing-repair.log

      - name: Write summary
        if: always()
        run: |
          if [ -f v054-routing-repair/summary.md ]; then
            cat v054-routing-repair/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v054-routing-repair-${{ github.run_id }}
          path: |
            v054-routing-repair/
            v054-routing-repair.log
          retention-days: 90
