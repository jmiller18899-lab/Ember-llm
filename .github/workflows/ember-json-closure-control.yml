name: Ember JSON Closing Norm-Matched Control CPU

on:
  push:
    branches: [claude/json-closure-norm-control]
    paths: [.github/ember-json-closure-control.launch]

permissions:
  contents: read

concurrency:
  group: ember-json-closure-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Verify control arm and inherited contracts
        run: python -m pytest -q tests/test_ember_json_closure.py tests/test_ember_rung0_trajectory.py tests/test_ember_first_update_diagnostic.py tests/test_ember_v050_teacher_kl.py tests/test_ember_v049_protected_replay.py
      - name: Run the norm-matched control arm
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
          PYTHONUNBUFFERED: '1'
        run: python jobs/ember_json_closure.py --mode norm-matched --output-dir json-closure-control-results
      - name: Publish summary
        if: always()
        run: |
          if [ -f json-closure-control-results/summary.md ]; then cat json-closure-control-results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-json-closure-control-${{ github.run_id }}
          path: json-closure-control-results/
          if-no-files-found: warn
          retention-days: 90
