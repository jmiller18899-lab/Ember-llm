name: Ember CPU Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ember-v0.0.7-hf-ready.zip"
      - ".github/workflows/ember-corpus.yml"
      - ".github/workflows/ember-validate.yml"
      - ".github/workflows/ember-hf.yml"
      - ".cursor/**"
      - "config/**"
      - "jobs/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - "ember-v0.0.7-hf-ready.zip"
      - ".github/workflows/ember-corpus.yml"
      - ".github/workflows/ember-validate.yml"
      - ".github/workflows/ember-hf.yml"
      - ".cursor/**"
      - "config/**"
      - "jobs/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Ember
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract Ember v0.0.7
        run: |
          rm -rf /tmp/ember-src
          mkdir -p /tmp/ember-src
          unzip -q ember-v0.0.7-hf-ready.zip -d /tmp/ember-src
          cat /tmp/ember-src/ember/VERSION

      - name: Verify authoritative Ember files
        run: |
          test -f /tmp/ember-src/ember/requirements-corpus.txt
          test -f /tmp/ember-src/ember/config/corpus_v0.0.7.json
          test -f /tmp/ember-src/ember/config/ember_agent_t4_validation.json
          test -f /tmp/ember-src/ember/scripts/preflight.py
          test -f /tmp/ember-src/ember/scripts/hf_train.py
          test -f /tmp/ember-src/ember/src/model.py
          test -f /tmp/ember-src/ember/src/tokenizer.py
          test "$(cat /tmp/ember-src/ember/VERSION)" = "0.0.7"
          echo "Authoritative Ember v0.0.7 files verified."

      - name: Verify Hugging Face Jobs launchers
        run: |
          python -m py_compile jobs/*.py
          python -m json.tool config/ember_agent_t4_long_v0.0.8.json >/dev/null
          python -m json.tool config/ember_agent_tool_sft_v0.0.9.json >/dev/null
          python -m json.tool config/ember_v0.0.8_eval.json >/dev/null
          python -m json.tool config/ember_agent_copy_canary_v0.0.13.json >/dev/null
          python -m json.tool config/ember_agent_copy_canary_v0.0.14.json >/dev/null
          python -m json.tool .cursor/environment.json >/dev/null
          bash -n .cursor/install.sh

      - name: Install CPU-only Ember dependencies
        working-directory: /tmp/ember-src/ember
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install -r requirements-corpus.txt

      - name: Run Ember tests
        working-directory: /tmp/ember-src/ember
        run: python -m pytest -q

      - name: Run v0.0.8 orchestration tests
        run: python -m pytest -q tests

      - name: Validation complete
        run: |
          echo "EMBER CPU VALIDATION PASSED"
          echo "Version: 0.0.7"
          echo "GPU training was NOT launched."
