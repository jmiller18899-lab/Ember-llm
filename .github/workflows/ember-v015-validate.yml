name: Ember v0.0.15 validation (temporary)

on:
  push:
    branches: [autofix/ember-v015-first-token-warmup-20260904]
    paths: [.github/workflows/ember-v015-validate.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autofix/ember-v015-first-token-warmup-20260904
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'huggingface-hub>=1.4' 'sentencepiece>=0.2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Static and curriculum tests
        run: |
          python -m py_compile jobs/ember_sft_data_v015.py jobs/ember_hf_sft_v015.py
          pytest -q tests/test_ember_v015_warmup.py tests/test_ember_copy_diagnostics.py
      - name: Real read-only v0.0.15 CPU preflight
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python jobs/ember_hf_sft_v015.py --preflight-only
