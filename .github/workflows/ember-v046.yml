name: Ember v0.0.46 Structural Prefix Diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        description: CPU-only structural-prefix diagnostic
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, diagnostic]
  push:
    branches: [codex/ember-v046-structural-prefix-diagnostic]
    paths: [.github/ember-v046.trigger]

permissions:
  contents: read

concurrency:
  group: ember-v046-structural-prefix-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Resolve mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode="$REQUESTED_MODE"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-v046.trigger)"
          fi
          case "$mode" in
            bootstrap|diagnostic) ;;
            *) echo 'Unsupported v0.0.46 mode'; exit 1 ;;
          esac
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.value == 'diagnostic'
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        if: steps.mode.outputs.value == 'diagnostic'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Test structural-prefix diagnostic and inherited guards
        if: steps.mode.outputs.value == 'diagnostic'
        run: |
          python -m py_compile jobs/ember_structural_prefix_v046.py jobs/ember_structural_prefix_v046_compat.py jobs/ember_residual_logit_v045.py jobs/ember_envelope_preflight_v041.py
          python -m pytest -q tests/test_ember_v046_structural_prefix.py tests/test_ember_v045_residual_logit.py tests/test_ember_v044_envelope_preflight.py tests/test_ember_v043_envelope_preflight.py tests/test_ember_v042_envelope_preflight.py tests/test_ember_v041_envelope_preflight.py tests/test_ember_v040_envelope_preflight.py tests/test_ember_v039_envelope_preflight.py tests/test_ember_v038_envelope_preflight.py tests/test_ember_v037_envelope_preflight.py tests/test_ember_v036_envelope_preflight.py tests/test_ember_v035_envelope_preflight.py tests/test_ember_v034_envelope_preflight.py
      - name: Run CPU-only structural-prefix diagnostic
        if: steps.mode.outputs.value == 'diagnostic'
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
        run: python jobs/ember_structural_prefix_v046_compat.py --output-dir v046-results
      - name: Show diagnostic summary
        if: always() && steps.mode.outputs.value == 'diagnostic'
        run: |
          if [ -f v046-results/summary.md ]; then
            cat v046-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The v0.0.46 diagnostic stopped before a summary was saved. Check the failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve diagnostic evidence
        if: always() && steps.mode.outputs.value == 'diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: ember-v046-structural-${{ github.run_id }}
          path: |
            v046-results/report.json
            v046-results/summary.md
          if-no-files-found: warn
          retention-days: 90
