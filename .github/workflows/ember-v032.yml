name: Ember v0.0.32 Semantic Learning

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded semantic learning experiment
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, canary, begin]
  push:
    branches: [codex/ember-v032-semantic-learning]
    paths: [.github/ember-v032.trigger]

permissions:
  contents: read

concurrency:
  group: ember-v032-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Resolve mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode="$REQUESTED_MODE"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-v032.trigger)"
          fi
          case "$mode" in
            bootstrap|canary|begin) ;;
            *) echo 'Unsupported v0.0.32 mode'; exit 1 ;;
          esac
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.value != 'bootstrap'
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        if: steps.mode.outputs.value != 'bootstrap'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 trackio==0.37.1 numpy==2.2.6
      - name: Test training, copy protections, semantic scoring, and launch guards
        if: steps.mode.outputs.value != 'bootstrap'
        run: python -m pytest -q tests/test_ember_v032_learning.py tests/test_ember_semantic_data.py tests/test_ember_semantic_gate.py
      - name: Run the bounded CPU learning canary and save its evidence
        if: steps.mode.outputs.value != 'bootstrap'
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
        run: python jobs/ember_semantic_train_v032.py --mode canary --output-dir v032-results
      - name: Submit one bounded T4 experiment only after the matching CPU PASS
        if: success() && steps.mode.outputs.value == 'begin'
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
        run: python jobs/ember_submit_v032.py --publication v032-results/publication.json
      - name: Preserve reports and submission receipts
        if: always() && steps.mode.outputs.value != 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: ember-v032-learning-${{ github.run_id }}
          path: |
            v032-results/report.json
            v032-results/history.json
            v032-results/identity.json
            v032-results/config.json
            v032-results/publication.json
            v032-results/gpu-submission.json
          if-no-files-found: warn
          retention-days: 90
