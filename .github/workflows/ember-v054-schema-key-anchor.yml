name: Ember v0.0.54 Schema-Key Anchor

on:
  push:
    branches:
      - codex/ember-v054-schema-key-anchor
    paths:
      - jobs/ember_v054_schema_key_anchor.py
      - .github/workflows/ember-v054-schema-key-anchor.yml
      - .github/ember-v054-schema-key-anchor.launch
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install "huggingface-hub>=1.4,<2" sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5
      - name: Validate repair
        run: |
          python -m py_compile jobs/ember_v054_schema_key_anchor.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py
      - name: Run bounded schema-key anchor
        run: python jobs/ember_v054_schema_key_anchor.py | tee v054-schema-key-anchor.log
      - name: Write summary
        if: always()
        run: |
          if [ -f v054-schema-key-anchor/summary.md ]; then cat v054-schema-key-anchor/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v054-schema-key-anchor-${{ github.run_id }}
          path: |
            v054-schema-key-anchor/
            v054-schema-key-anchor.log
          retention-days: 90
