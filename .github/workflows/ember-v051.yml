name: Ember v0.0.51 Placement Dose Response Ladder

on:
  workflow_dispatch:
    inputs:
      mode:
        description: CPU-only placement dose-response ladder
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, ladder]
  push:
    branches: [claude/ember-v0025-plateau-tnxpua]
    paths: [.github/ember-v051.trigger]

permissions:
  contents: read

concurrency:
  group: ember-v051-placement-ladder
  cancel-in-progress: false

jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Resolve mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode="$REQUESTED_MODE"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-v051.trigger)"
          fi
          case "$mode" in
            bootstrap|ladder) ;;
            *) echo 'Unsupported v0.0.51 mode'; exit 1 ;;
          esac
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.value == 'ladder'
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        if: steps.mode.outputs.value == 'ladder'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Test the ladder and inherited guards
        if: steps.mode.outputs.value == 'ladder'
        run: python -m pytest -q tests/test_ember_v051_placement_ladder.py tests/test_ember_placement_probe_check.py tests/test_ember_v050_teacher_kl.py tests/test_ember_v049_protected_replay.py tests/test_ember_v048_two_objective.py tests/test_ember_v047_envelope_template.py tests/test_ember_v046_structural_prefix.py tests/test_ember_v045_residual_logit.py tests/test_ember_v044_envelope_preflight.py
      - name: Run the CPU-only placement dose-response ladder
        if: steps.mode.outputs.value == 'ladder'
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
        run: python jobs/ember_v051_ladder.py --output-dir v051-results
      - name: Show the frontier
        if: always() && steps.mode.outputs.value == 'ladder'
        run: |
          if [ -f v051-results/summary.md ]; then
            cat v051-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The v0.0.51 ladder stopped before a summary was saved. Check the failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve the ladder evidence
        if: always() && steps.mode.outputs.value == 'ladder'
        uses: actions/upload-artifact@v4
        with:
          name: ember-v051-ladder-${{ github.run_id }}
          path: |
            v051-results/report.json
            v051-results/summary.md
          if-no-files-found: warn
          retention-days: 90
