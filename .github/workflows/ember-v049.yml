name: Ember v0.0.49 Protected Learning Canary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: CPU-only protected-learning canary
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, canary]
  push:
    branches: [claude/ember-v0025-plateau-tnxpua]
    paths: [.github/ember-v049.trigger]

permissions:
  contents: read

concurrency:
  group: ember-v049-protected-learning
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Resolve mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode="$REQUESTED_MODE"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-v049.trigger)"
          fi
          case "$mode" in
            bootstrap|canary) ;;
            *) echo 'Unsupported v0.0.49 mode'; exit 1 ;;
          esac
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.value == 'canary'
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        if: steps.mode.outputs.value == 'canary'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Test protected-learning guards and inherited gates
        if: steps.mode.outputs.value == 'canary'
        run: python -m pytest -q tests/test_ember_v049_protected_learning.py tests/test_ember_v048_two_objective.py tests/test_ember_v047_envelope_template.py tests/test_ember_v046_structural_prefix.py tests/test_ember_v045_residual_logit.py tests/test_ember_v044_envelope_preflight.py tests/test_ember_v043_envelope_preflight.py tests/test_ember_v042_envelope_preflight.py tests/test_ember_v040_envelope_preflight.py tests/test_ember_v039_envelope_preflight.py tests/test_ember_v038_envelope_preflight.py tests/test_ember_v037_envelope_preflight.py tests/test_ember_v036_envelope_preflight.py tests/test_ember_v035_envelope_preflight.py tests/test_ember_v034_envelope_preflight.py tests/test_ember_v032_learning.py tests/test_ember_semantic_data.py tests/test_ember_semantic_gate.py
      - name: Run CPU-only protected-learning canary
        if: steps.mode.outputs.value == 'canary'
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
        run: python jobs/ember_v049_canary.py --output-dir v049-results
      - name: Show measured canary result
        if: always() && steps.mode.outputs.value == 'canary'
        run: |
          if [ -f v049-results/summary.md ]; then
            cat v049-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The v0.0.49 canary stopped before a summary was saved. Check the failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve CPU canary evidence
        if: always() && steps.mode.outputs.value == 'canary'
        uses: actions/upload-artifact@v4
        with:
          name: ember-v049-canary-${{ github.run_id }}
          path: |
            v049-results/report.json
            v049-results/summary.md
          if-no-files-found: warn
          retention-days: 90
