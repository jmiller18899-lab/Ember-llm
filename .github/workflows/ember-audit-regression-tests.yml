name: Ember audit CPU regression tests
on:
  push:
    branches: [codex/ember-direct-answer-audit-20260922]
    paths:
      - .github/workflows/ember-audit-regression-tests.yml
      - jobs/ember_direct_answer_audit.py
      - tests/test_ember_direct_answer_audit.py
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install required CPU test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install huggingface-hub==1.31.0 pytest sentencepiece numpy jsonschema
      - name: Run repository-wide tests
        run: python -m pytest -q
      - name: Audit-specific contracts
        if: always()
        run: python -m pytest -q tests/test_ember_direct_answer_audit.py
