name: Ember WR12 preflight and launch
"on":
  push:
    branches: [codex/ember-writing-repair12-20261012]
    paths:
      - .github/workflows/ember-writing-repair12.yml
      - jobs/ember_writing_repair12_data.py
      - jobs/ember_writing_repair12_train.py
      - tests/test_ember_writing_repair12.py
      - reports/writing-repair12-design-20261012.md
      - jobs/wr12-20261012.launch
permissions:
  contents: read
concurrency:
  group: ember-wr12-20261012
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.EMBER_HF_TOKEN }}
      WR12_CODE_COMMIT: ${{ github.sha }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Verify CPU contracts
        run: python3 -m unittest discover -s tests -p test_ember_writing_repair12.py
      - name: Verify frozen inputs and real semantic-token alignment
        run: uv run --python 3.11 jobs/ember_writing_repair12_train.py --preflight
      - name: Submit the authorized WR12 run once
        if: contains(github.event.head_commit.message, 'Launch authorized WR12 semantic-anchor training')
        run: uv run --python 3.11 jobs/ember_writing_repair12_train.py --launch
