name: Ember Tiny Overfit CPU Diagnostic

on:
  push:
    branches:
      - codex/ember-tiny-overfit
    paths:
      - .github/ember-tiny-overfit.launch

permissions:
  contents: read

jobs:
  tiny-overfit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.H_F2 }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install huggingface-hub==1.3.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6

      - name: Validate diagnostic code
        run: |
          python -m py_compile jobs/ember_tiny_overfit.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py

      - name: Run tiny overfit diagnostic
        run: |
          python jobs/ember_tiny_overfit.py --output-dir tiny-overfit-results

      - name: Publish summary
        if: always()
        run: |
          if [ -f tiny-overfit-results/summary.md ]; then
            cat tiny-overfit-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-tiny-overfit-${{ github.run_id }}
          path: tiny-overfit-results/
          retention-days: 90
          if-no-files-found: warn
