name: Ember 4B frozen promotion v2 eval (inference only)
on:
  push:
    branches: [claude/new-session-tuz2t4]
    paths: [.github/workflows/ember-4b-promotion-v2-frozen-eval.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: CPU checks
        run: |
          python -m py_compile jobs/ember_4b_promotion_v2_frozen_eval.py
          python - <<'PY'
          import importlib.util
          def load(p,n):
              s=importlib.util.spec_from_file_location(n,p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          ev=load("jobs/ember_4b_promotion_v2_frozen_eval.py","ev")
          rows=ev.build()
          assert rows==load("jobs/build_ember_promotion_suite_v2.py","suite").build()
          for r in rows:
              ev.system_for(r["prompt"])
              if r["scoring"]=="rubric": ev.rubric_pass(r,"")
          print("PREFLIGHT_OK",len(rows))
          PY
      - name: Launch one capped L4 evaluation
        env:
          HF_TOKEN: ${{ secrets.HF_2 || secrets.HF_TOKEN }}
        run: |
          python -m pip install huggingface-hub==1.31.0
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ["HF_TOKEN"]; api=HfApi(token=token)
          job=api.run_uv_job("jobs/ember_4b_promotion_v2_frozen_eval.py",python="3.11",flavor="l4x1",timeout=3600,name="ember-frozen-promo-v2-eval",secrets={"HF_TOKEN":token},env={"TOKENIZERS_PARALLELISM":"false"})
          print("PROMO_V2_FROZEN_JOB",job.id,job.url)
          PY
