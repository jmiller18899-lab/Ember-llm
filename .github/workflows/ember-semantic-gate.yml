name: Ember Semantic CPU Gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: CPU semantic evaluation only
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, evaluate]
  push:
    branches:
      - codex/ember-v031-semantic-cpu-gate
    paths:
      - .github/ember-semantic.trigger

permissions:
  contents: read

concurrency:
  group: ember-semantic-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Resolve mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode="$REQUESTED_MODE"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-semantic.trigger)"
          fi
          case "$mode" in
            bootstrap|evaluate) ;;
            *) echo 'Unsupported semantic gate mode'; exit 1 ;;
          esac
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.value == 'evaluate'
        with:
          python-version: '3.11'
      - name: Install CPU evaluator dependencies
        if: steps.mode.outputs.value == 'evaluate'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install sentencepiece==0.2.0 'huggingface-hub>=1.4,<2' jsonschema==4.23.0 pytest==8.3.5
      - name: Test the scoring and decoding contract
        if: steps.mode.outputs.value == 'evaluate'
        run: python -m pytest -q tests/test_ember_semantic_gate.py tests/test_v008_readiness.py
      - name: Evaluate v0.0.31 full and INT4 on this CPU runner
        if: steps.mode.outputs.value == 'evaluate'
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
        run: python jobs/ember_semantic_gate.py --output-dir semantic-results --publish
      - name: Preserve the report, including a failed model gate
        if: always() && steps.mode.outputs.value == 'evaluate'
        uses: actions/upload-artifact@v4
        with:
          name: ember-v031-semantic-v1-${{ github.run_id }}
          path: semantic-results/
          if-no-files-found: warn
          retention-days: 90
