name: Ember v0.0.54 Block-3 Router Confirmation

on:
  push:
    branches:
      - codex/ember-v054-router-confirmation
    paths:
      - jobs/ember_v054_router_confirmation.py
      - .github/workflows/ember-v054-router-confirmation.yml
      - .github/ember-v054-router-confirmation.launch
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
    steps:
      - name: Checkout confirmation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install "huggingface-hub>=1.4,<2" sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5

      - name: Validate confirmation diagnostic
        run: |
          python -m py_compile jobs/ember_v054_router_confirmation.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py

      - name: Run block-3 router confirmation
        run: python jobs/ember_v054_router_confirmation.py | tee v054-router-confirmation.log

      - name: Write summary
        if: always()
        run: |
          if [ -f v054-router-confirmation/summary.md ]; then
            cat v054-router-confirmation/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v054-router-confirmation-${{ github.run_id }}
          path: |
            v054-router-confirmation/
            v054-router-confirmation.log
          retention-days: 90
