name: Ember Placement Probe Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only CPU placement probe diagnostic
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, check]
  push:
    branches: [claude/ember-v0025-plateau-tnxpua]
    paths: [.github/ember-placement-probe-check.trigger]

permissions:
  contents: read

concurrency:
  group: ember-placement-probe-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Resolve mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode="$REQUESTED_MODE"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-placement-probe-check.trigger)"
          fi
          case "$mode" in
            bootstrap|check) ;;
            *) echo 'Unsupported probe-check mode'; exit 1 ;;
          esac
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.value == 'check'
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        if: steps.mode.outputs.value == 'check'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Test the diagnostic
        if: steps.mode.outputs.value == 'check'
        run: python -m pytest -q tests/test_ember_placement_probe_check.py tests/test_ember_v050_teacher_kl.py tests/test_ember_v049_protected_replay.py tests/test_ember_v048_two_objective.py
      - name: Run the read-only placement probe check
        if: steps.mode.outputs.value == 'check'
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
        run: python jobs/ember_placement_probe_check.py --output-dir probe-check-results
      - name: Show the diagnostic
        if: always() && steps.mode.outputs.value == 'check'
        run: |
          if [ -f probe-check-results/summary.md ]; then
            cat probe-check-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The probe check stopped before a summary was saved. Check the failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve the diagnostic evidence
        if: always() && steps.mode.outputs.value == 'check'
        uses: actions/upload-artifact@v4
        with:
          name: ember-placement-probe-check-${{ github.run_id }}
          path: |
            probe-check-results/report.json
            probe-check-results/summary.md
          if-no-files-found: warn
          retention-days: 90
