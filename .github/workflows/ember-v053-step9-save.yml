name: Ember v0.0.53 Step 9 Candidate Save

on:
  push:
    paths:
      - '.github/ember-v053-step9-save.launch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install "huggingface-hub>=1.4,<2" sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5

      - name: Validate saver
        run: |
          python -m py_compile jobs/ember_save_v053_step9.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py

      - name: Reproduce and save v0.0.53 step 9
        run: python jobs/ember_save_v053_step9.py | tee v053-step9-save.log

      - name: Write summary
        if: always()
        run: |
          {
            echo '# Ember v0.0.53 step-9 candidate save'
            echo
            if [ -f v053-step9-save.log ]; then
              grep -E 'EMBER_V053_STEP9_SAVE|MODEL_REPO|RUN_ID|CHECKPOINT_PATH|INT4_PATH|CHECKPOINT_SHA256|INT4_SHA256' v053-step9-save.log || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v053-step9-save-${{ github.run_id }}
          path: v053-step9-save.log
          retention-days: 90
