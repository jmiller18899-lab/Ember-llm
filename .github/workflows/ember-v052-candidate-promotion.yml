name: Ember v0.0.52 Candidate Save and Gated Promotion

on:
  push:
    branches:
      - codex/ember-v052-candidate-save
    paths:
      - .github/ember-v052-candidate.launch

permissions:
  contents: read

jobs:
  save-evaluate-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.H_F2 }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install "huggingface-hub>=1.4,<2" sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6

      - name: Validate candidate save code
        run: |
          python -m py_compile jobs/ember_save_trust_candidate_v052.py jobs/ember_finalize_v052_promotion.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py

      - name: Reproduce and save v0.0.52 candidate checkpoint
        run: |
          python jobs/ember_save_trust_candidate_v052.py | tee v052-save.log

      - name: Run formal held-out promotion evaluation
        run: |
          python jobs/ember_hf_eval.py --model-name ember-v0.0.52-t4 --label v052-trust-region-candidate | tee v052-eval.log

      - name: Finalize gated promotion decision
        if: always()
        run: |
          python jobs/ember_finalize_v052_promotion.py | tee v052-promotion.log

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo '# Ember v0.0.52 candidate save / promotion'
            echo
            if [ -f v052-save.log ]; then grep -E 'EMBER_V052_CANDIDATE_SAVE|MODEL_REPO|RUN_ID|CHECKPOINT_PATH|INT4_PATH|STRICT_PROMOTION_ELIGIBLE' v052-save.log || true; fi
            echo
            if [ -f v052-promotion.log ]; then cat v052-promotion.log; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v052-candidate-${{ github.run_id }}
          path: |
            v052-save.log
            v052-eval.log
            v052-promotion.log
          retention-days: 90
          if-no-files-found: warn
