name: Ember Hugging Face Jobs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bootstrap, corpus, evaluation, or explicitly approved training mode"
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - corpus
          - train
          - eval-v007
          - train-v008
          - eval-v008
          - preflight-v009
          - sft-v009
          - eval-v009
  push:
    branches:
      - main
    paths:
      - ".github/ember-hf.trigger"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Ember
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve requested mode
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-hf.trigger)"
          fi
          case "$mode" in
            bootstrap|corpus|train|eval-v007|train-v008|eval-v008|preflight-v009|sft-v009|eval-v009) ;;
            *) echo "::error::Unsupported Ember HF mode: $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved Ember HF mode: $mode"

      - name: Install Hugging Face Jobs client
        run: python -m pip install --upgrade "huggingface-hub>=1.4"

      - name: Verify write access and private persistence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python jobs/ember_hf_bootstrap.py

      - name: Submit full corpus job to Hugging Face CPU Upgrade
        if: ${{ steps.request.outputs.mode == 'corpus' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-7-corpus \
            --flavor cpu-upgrade \
            --timeout 6h \
            --secrets HF_TOKEN \
            jobs/ember_hf_corpus.py

      - name: Submit gated T4 validation job
        if: ${{ steps.request.outputs.mode == 'train' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-7-t4-validation \
            --flavor t4-small \
            --timeout 4h \
            --secrets HF_TOKEN \
            jobs/ember_hf_train.py

      - name: Submit v0.0.7 CPU baseline evaluation
        if: ${{ steps.request.outputs.mode == 'eval-v007' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-7-baseline-eval \
            --flavor cpu-upgrade \
            --timeout 2h \
            --secrets HF_TOKEN \
            jobs/ember_hf_eval.py -- \
            --model-name ember-v0.0.7-t4 \
            --label baseline-v0.0.7

      - name: Submit explicitly approved v0.0.8 long T4 run
        if: ${{ steps.request.outputs.mode == 'train-v008' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-8-t4-long \
            --flavor t4-small \
            --timeout 3h \
            --secrets HF_TOKEN \
            jobs/ember_hf_train_v008.py

      - name: Submit v0.0.8 CPU candidate evaluation
        if: ${{ steps.request.outputs.mode == 'eval-v008' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-8-candidate-eval \
            --flavor cpu-upgrade \
            --timeout 2h \
            --secrets HF_TOKEN \
            jobs/ember_hf_eval.py -- \
            --model-name ember-v0.0.8-t4 \
            --label candidate-v0.0.8

      - name: Submit explicitly approved v0.0.9 tool-routing SFT
        if: ${{ steps.request.outputs.mode == 'sft-v009' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-9-tool-sft \
            --flavor t4-small \
            --timeout 2h \
            --secrets HF_TOKEN \
            jobs/ember_hf_sft_v009.py

      - name: Submit v0.0.9 SFT CPU preflight
        if: ${{ steps.request.outputs.mode == 'preflight-v009' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-9-sft-preflight \
            --flavor cpu-upgrade \
            --timeout 1h \
            --secrets HF_TOKEN \
            jobs/ember_hf_sft_v009.py -- \
            --preflight-only

      - name: Submit v0.0.9 CPU candidate evaluation
        if: ${{ steps.request.outputs.mode == 'eval-v009' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-9-candidate-eval \
            --flavor cpu-upgrade \
            --timeout 2h \
            --secrets HF_TOKEN \
            jobs/ember_hf_eval.py -- \
            --model-name ember-v0.0.9-t4 \
            --label candidate-v0.0.9

      - name: Confirm launcher safety gate
        run: |
          echo "Ember HF launcher completed in ${{ steps.request.outputs.mode }} mode."
          case "${{ steps.request.outputs.mode }}" in
            train|train-v008|sft-v009) echo "An explicitly selected paid GPU mode was launched." ;;
            *) echo "GPU training was NOT launched." ;;
          esac
