name: Ember Frozen Tool Assistant

on:
  push:
    branches: [codex/ember-tool-assistant-freeze]
    paths:
      - tool_assistant/**
      - tests/test_tool_assistant.py
      - .github/workflows/ember-tool-assistant.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install huggingface-hub==1.31.0 sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5
      - name: Validate runtime and frozen test contract
        run: python -m pytest -q tests/test_tool_assistant.py
      - name: Freeze original router and extractor together
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m tool_assistant.build --out frozen-candidate | tee freeze.log
      - name: Confirm on 100 new requests
        id: confirmation
        continue-on-error: true
        run: python -m tool_assistant.evaluate --bundle frozen-candidate --cases tool_assistant/data/confirmation-100.json --report evidence/combined-confirmation.json | tee confirmation.log
      - name: Package passing prototype
        if: steps.confirmation.outcome == 'success'
        run: |
          cp docs/ember-tool-assistant.md frozen-candidate/README.md
          cp tool_assistant/requirements.txt frozen-candidate/requirements.txt
          python -c "import shutil; shutil.make_archive('ember-tool-assistant-prototype', 'zip', 'frozen-candidate')"
      - name: Write measured summary
        if: always()
        run: |
          if [ -f evidence/combined-confirmation.md ]; then cat evidence/combined-confirmation.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve frozen state and all measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-tool-assistant-evidence-${{ github.run_id }}
          path: |
            evidence/
            freeze.log
            confirmation.log
            frozen-candidate/manifest.json
            frozen-candidate/router-*.pt
            frozen-candidate/family.pt
          retention-days: 90
      - name: Preserve passing prototype
        if: steps.confirmation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ember-tool-assistant-prototype-${{ github.run_id }}
          path: ember-tool-assistant-prototype.zip
          retention-days: 90
      - name: Enforce combined gate
        if: always()
        run: test '${{ steps.confirmation.outcome }}' = 'success'
