name: Ember v0.0.24 Diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "v0.0.24 action"
        required: true
        default: diagnostic
        type: choice
        options:
          - diagnostic
          - bootstrap
  push:
    branches:
      - main
    paths:
      - ".github/ember-v024.trigger"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Ember
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve mode
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-v024.trigger)"
          fi
          case "$mode" in
            diagnostic|bootstrap) ;;
            *) echo "::error::Unsupported v0.0.24 mode: $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved Ember v0.0.24 mode: $mode"

      - name: Install Hugging Face Jobs client
        run: python -m pip install --upgrade "huggingface-hub>=1.4"

      - name: Verify H_F2 Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
        run: python jobs/ember_hf_bootstrap.py

      - name: Submit v0.0.24 CPU token diagnostic
        if: ${{ steps.request.outputs.mode == 'diagnostic' }}
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-24-token-support-capacity-diagnostic \
            --flavor cpu-upgrade \
            --timeout 1h \
            --secrets HF_TOKEN \
            jobs/ember_hf_diag_v024.py

      - name: Safety summary
        run: |
          echo "Ember v0.0.24 is CPU diagnostic-only. No paid GPU training can be submitted by this workflow."
