name: Ember Bounded First Update CPU Diagnostic

on:
  push:
    branches: [codex/ember-bounded-first-update-diagnostic]
    paths: [.github/ember-first-update.launch]

permissions:
  contents: read

concurrency:
  group: ember-bounded-first-update-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Verify diagnostic and inherited objective contracts
        run: python -m pytest -q tests/test_ember_first_update_diagnostic.py tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_v050_teacher_kl.py tests/test_ember_v049_protected_replay.py
      - name: Run one bounded CPU proposal and both evaluations
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
          PYTHONUNBUFFERED: '1'
        run: python jobs/ember_first_update_diagnostic.py --output-dir first-update-results
      - name: Publish summary
        if: always()
        run: |
          if [ -f first-update-results/summary.md ]; then cat first-update-results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-first-update-${{ github.run_id }}
          path: first-update-results/
          if-no-files-found: warn
          retention-days: 90
