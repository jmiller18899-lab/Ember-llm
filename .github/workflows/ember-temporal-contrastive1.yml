name: Ember temporal contrastive repair 1
on:
  push:
    branches: [codex/ember-4b-acceleration-sprint1]
    paths: [.github/workflows/ember-temporal-contrastive1.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Validate contrastive pairs
        run: python jobs/ember_4b_temporal_contrastive1.py --preflight
      - name: Launch capped L4 contrastive repair
        env:
          HF_TOKEN: ${{ secrets.HF_2 || secrets.HF_TOKEN }}
        run: |
          python -m pip install huggingface-hub==1.31.0
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ["HF_TOKEN"]; api=HfApi(token=token)
          repo="Jmiller18899/ember-qwen3.5-4b-temporal-contrastive1"; api.create_repo(repo,private=True,exist_ok=True)
          if api.file_exists(repo,"launch.json"): raise RuntimeError("contrastive repair already launched")
          api.upload_file(repo_id=repo,path_in_repo="launch.json",path_or_fileobj=b'{"status":"reserved"}',commit_message="Reserve contrastive temporal repair")
          job=api.run_uv_job("jobs/ember_4b_temporal_contrastive1.py",python="3.11",flavor="l4x1",timeout=5400,name="ember-temporal-contrastive1",secrets={"HF_TOKEN":token},env={"TOKENIZERS_PARALLELISM":"false"})
          api.upload_file(repo_id=repo,path_in_repo="launch.json",path_or_fileobj=(f'{{"status":"submitted","job_id":"{job.id}"}}').encode(),commit_message="Record contrastive temporal job")
          print("CONTRASTIVE_JOB",job.id,job.url)
          PY
