name: Ember v0.0.5 Corpus Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate sources, or build and verify the full 15M-token corpus"
        required: true
        default: source-smoke
        type: choice
        options:
          - source-smoke
          - full-corpus

permissions:
  contents: read

jobs:
  corpus:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout ember-llm
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract authoritative Ember v0.0.5
        run: |
          test -f ember-v0.0.5-hf-ready.zip
          rm -rf /tmp/ember-src
          mkdir -p /tmp/ember-src
          unzip -q ember-v0.0.5-hf-ready.zip -d /tmp/ember-src
          test "$(cat /tmp/ember-src/ember/VERSION)" = "0.0.5"
          echo "EMBER_ROOT=/tmp/ember-src/ember" >> "$GITHUB_ENV"

      - name: Require authenticated Hugging Face access for full corpus
        if: ${{ inputs.mode == 'full-corpus' }}
        working-directory: /tmp/ember-src/ember
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is unavailable to this workflow. Add it as a repository Actions secret named HF_TOKEN."
            exit 1
          fi
          echo "HF_TOKEN is available; its value is not printed."

      - name: Install corpus-only dependencies
        working-directory: /tmp/ember-src/ember
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-corpus.txt

      - name: Run corpus and tokenizer unit tests
        working-directory: /tmp/ember-src/ember
        run: |
          python -m pytest -q \
            tests/test_corpus.py \
            tests/test_corpus_pipeline.py \
            tests/test_data.py \
            tests/test_tokenizer.py

      - name: Source/network/schema smoke test
        working-directory: /tmp/ember-src/ember
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          python scripts/source_smoke.py 2>&1 | tee /tmp/ember-source-smoke.log
          rc=${PIPESTATUS[0]}
          set -e

          python - <<'PY'
          import datasets
          import pyarrow
          print("datasets:", datasets.__version__)
          print("pyarrow:", pyarrow.__version__)
          PY

          if [ "$rc" -eq 0 ]; then
            exit 0
          fi

          if [ "$rc" -eq 134 ] \
            && grep -q '"source_smoke": "PASS"' /tmp/ember-source-smoke.log \
            && grep -q 'PyGILState_Release' /tmp/ember-source-smoke.log \
            && grep -q 'Python runtime state: finalizing' /tmp/ember-source-smoke.log; then
            echo "KNOWN PYARROW TEARDOWN ABORT AFTER SUCCESSFUL EMBER SOURCE SMOKE — accepting PASS"
            exit 0
          fi

          echo "Source smoke genuinely failed with exit code $rc"
          exit "$rc"

      - name: Print runner capacity before corpus build
        if: ${{ inputs.mode == 'full-corpus' }}
        run: |
          free -h
          df -h /

      - name: Build 15M-token Ember corpus
        if: ${{ inputs.mode == 'full-corpus' }}
        working-directory: /tmp/ember-src/ember
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/build_training_corpus.py \
            --config config/corpus_v0.0.5.json

      - name: Print corpus gate summary
        if: ${{ inputs.mode == 'full-corpus' }}
        working-directory: /tmp/ember-src/ember
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("data/processed/corpus_stats.json").read_text())
          assert s["status"] == "PASS"
          assert 10_000_000 <= s["actual_ember_tokens"] <= 20_000_000
          assert s["vocab_size"] == 16_384
          print(json.dumps({
              "status": s["status"],
              "actual_ember_tokens": s["actual_ember_tokens"],
              "train_tokens": s["train_tokens"],
              "val_tokens": s["val_tokens"],
              "vocab_size": s["vocab_size"],
              "category_selected_tokens": s["category_selected_tokens"],
              "documents": s["documents"],
              "dedup": s["dedup"],
          }, indent=2))
          PY

      - name: Upload verified corpus artifact
        if: ${{ inputs.mode == 'full-corpus' }}
        uses: actions/upload-artifact@v4
        with:
          name: ember-v0.0.5-corpus
          path: |
            /tmp/ember-src/ember/data/processed/train.txt
            /tmp/ember-src/ember/data/processed/val.txt
            /tmp/ember-src/ember/data/processed/ember_tokenizer.model
            /tmp/ember-src/ember/data/processed/corpus_stats.json
            /tmp/ember-src/ember/data/processed/provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm no GPU training launched
        run: |
          echo "Ember v0.0.5 corpus stage finished."
          echo "Mode: ${{ inputs.mode }}"
          echo "GPU training was NOT launched."

  preflight:
    name: CPU model preflight
    if: ${{ inputs.mode == 'full-corpus' }}
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout ember-llm
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Extract authoritative Ember v0.0.5
        run: |
          rm -rf /tmp/ember-src
          mkdir -p /tmp/ember-src
          unzip -q ember-v0.0.5-hf-ready.zip -d /tmp/ember-src
          test "$(cat /tmp/ember-src/ember/VERSION)" = "0.0.5"

      - name: Install CPU model dependencies
        working-directory: /tmp/ember-src/ember
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install -r requirements-corpus.txt

      - name: Download verified corpus artifact
        uses: actions/download-artifact@v4
        with:
          name: ember-v0.0.5-corpus
          path: /tmp/ember-src/ember/data/processed

      - name: Run complete Ember unit suite
        working-directory: /tmp/ember-src/ember
        run: python -m pytest -q

      - name: CPU corpus + model + INT4 preflight
        working-directory: /tmp/ember-src/ember
        run: |
          python scripts/preflight.py \
            --config config/ember_agent_t4_validation.json \
            --data data/processed/train.txt \
            --val-data data/processed/val.txt

      - name: Confirm no GPU training launched
        run: |
          echo "EMBER v0.0.5 CPU PREFLIGHT PASSED"
          echo "GPU training was NOT launched."

