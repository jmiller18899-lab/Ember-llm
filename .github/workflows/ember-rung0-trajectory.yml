name: Ember Rung 0 CPU Trajectory

on:
  push:
    branches: [codex/ember-rung0-trajectory, claude/rung0-full-checks]
    paths: [.github/ember-rung0-trajectory.launch]

permissions:
  contents: read

concurrency:
  group: ember-rung0-trajectory
  cancel-in-progress: false

jobs:
  trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6
      - name: Verify trajectory and inherited contracts
        run: python -m pytest -q tests/test_ember_rung0_trajectory.py tests/test_ember_first_update_diagnostic.py tests/test_ember_v050_teacher_kl.py tests/test_ember_v049_protected_replay.py
      - name: Trace one fixed 40-step CPU trajectory
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
          PYTHONUNBUFFERED: '1'
        run: |
          python jobs/ember_rung0_trajectory.py \
            --output-dir rung0-trajectory-results \
            --full-eval-steps 12,13,23 \
            --wall-time-limit 3000
      - name: Publish summary
        if: always()
        run: |
          if [ -f rung0-trajectory-results/summary.md ]; then cat rung0-trajectory-results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-rung0-trajectory-${{ github.run_id }}
          path: rung0-trajectory-results/
          if-no-files-found: warn
          retention-days: 90
