name: Ember v0.0.53 First Token Margin Anchor

on:
  push:
    branches:
      - codex/ember-v053-first-token-anchor
    paths:
      - .github/ember-v053-first-token-margin-anchor.launch

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install "huggingface-hub>=1.4,<2" sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5
      - name: Validate diagnostic
        run: |
          python -m py_compile jobs/ember_v053_first_token_margin_anchor.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py
      - name: Run rank-margin first-token anchor
        run: python jobs/ember_v053_first_token_margin_anchor.py | tee v053-margin-anchor.log
      - name: Write summary
        if: always()
        run: |
          if [ -f v053-first-token-margin-anchor/summary.md ]; then cat v053-first-token-margin-anchor/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v053-first-token-margin-anchor-${{ github.run_id }}
          path: |
            v053-first-token-margin-anchor/
            v053-margin-anchor.log
          retention-days: 90
