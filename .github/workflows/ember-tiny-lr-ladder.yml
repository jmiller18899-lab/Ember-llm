name: Ember Tiny LR Overfit Ladder

on:
  push:
    branches:
      - codex/ember-tiny-lr-ladder
    paths:
      - .github/ember-tiny-lr-ladder.launch

permissions:
  contents: read

jobs:
  tiny-lr-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.H_F2 }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
    steps:
      - name: Checkout ladder branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install huggingface-hub==1.3.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 numpy==2.2.6

      - name: Validate ladder code
        run: |
          python -m py_compile jobs/ember_tiny_overfit.py jobs/ember_tiny_lr_ladder.py
          pytest -q tests/test_ember_v051_placement_teacher_kl.py tests/test_ember_rung0_trajectory.py

      - name: Run tiny learning-rate ladder
        run: |
          python jobs/ember_tiny_lr_ladder.py --output-dir tiny-lr-ladder-results

      - name: Publish summary
        if: always()
        run: |
          if [ -f tiny-lr-ladder-results/summary.md ]; then
            cat tiny-lr-ladder-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ladder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-tiny-lr-ladder-${{ github.run_id }}
          path: tiny-lr-ladder-results/
          retention-days: 90
          if-no-files-found: warn
