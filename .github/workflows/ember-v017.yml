name: Ember v0.0.17 Jobs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "v0.0.17 action"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - train
          - bootstrap
  push:
    branches:
      - main
    paths:
      - ".github/ember-v017.trigger"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Ember
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve mode
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-v017.trigger)"
          fi
          case "$mode" in
            preflight|train|bootstrap) ;;
            *) echo "::error::Unsupported v0.0.17 mode: $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved Ember v0.0.17 mode: $mode"

      - name: Install Hugging Face Jobs client
        run: python -m pip install --upgrade "huggingface-hub>=1.4"

      - name: Verify H_F2 Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
        run: python jobs/ember_hf_bootstrap.py

      - name: Submit v0.0.17 CPU preflight
        if: ${{ steps.request.outputs.mode == 'preflight' }}
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-17-sequence-preflight \
            --flavor cpu-upgrade \
            --timeout 1h \
            --secrets HF_TOKEN \
            jobs/ember_hf_sft_v017.py -- \
            --preflight-only

      - name: Submit one approved v0.0.17 T4 training session
        if: ${{ steps.request.outputs.mode == 'train' }}
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-17-sequence-copy \
            --flavor t4-small \
            --timeout 2h \
            --secrets HF_TOKEN \
            jobs/ember_hf_sft_v017.py

      - name: Safety summary
        run: |
          case "${{ steps.request.outputs.mode }}" in
            train) echo "One explicitly approved Ember v0.0.17 paid T4 session was submitted." ;;
            *) echo "No paid GPU training was submitted by this run." ;;
          esac
