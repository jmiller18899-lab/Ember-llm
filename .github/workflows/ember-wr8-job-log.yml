name: Ember WR8 job log
# Read-only status for the current WR8 GPU job. Poll after the L4 queue.
"on":
  workflow_dispatch:
  push:
    branches: [cursor/ember-meaning-wr8-4cca]
    paths:
      - .github/workflows/ember-wr8-job-log.yml
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read WR8 job status and log tail
        env:
          HF_TOKEN: ${{ secrets.EMBER_HF_TOKEN }}
          JOB_ID: 6ac93f7cfee2c9007017c571
        run: |
          python -m pip install -q huggingface-hub==1.31.0
          python - <<'PY'
          import os, re
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          jid = os.environ["JOB_ID"]
          info = api.inspect_job(job_id=jid)
          print("JOB_STATUS", info.status)
          print("JOB_CREATED", getattr(info, "created_at", None))
          print("JOB_STARTED", getattr(info, "started_at", None) or getattr(info, "running_at", None))
          print("JOB_FINISHED", getattr(info, "finished_at", None) or getattr(info, "ended_at", None))
          print("JOB_FLAVOR", getattr(info, "flavor", None))
          interesting = ("id", "status", "created_at", "started_at", "finished_at", "ended_at", "flavor", "timeout")
          print("JOB_FIELDS", {name: str(getattr(info, name)) for name in dir(info) if name in interesting or name.endswith("_at")})
          lines = [re.sub(r"hf_[A-Za-z0-9]+", "[REDACTED]", str(line)) for line in api.fetch_job_logs(job_id=jid)]
          print("LOG_LINES", len(lines))
          keys = ("Traceback", "Error", "Exception", "WR8_", "Timeout", "Killed", "CUDA", "OutOfMemory", "ModuleNotFound")
          print("---- MATCHING LINES ----")
          for line in lines:
              if any(key in line for key in keys):
                  print(line)
          print("---- LOG TAIL ----")
          for line in lines[-80:]:
              print(line)
          PY
