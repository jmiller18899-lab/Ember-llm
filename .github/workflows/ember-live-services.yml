name: Ember Live Service Smoke

on:
  push:
    branches: [codex/ember-routing-v4]
    paths:
      - tool_assistant/live_services.py
      - tool_assistant/live_smoke.py
      - tool_assistant/restore_live_candidate.py
      - tests/test_live_services.py
      - tests/test_restore_live_candidate.py
      - .github/workflows/ember-live-services.yml
      - .github/workflows/ember-live-services-run.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  live:
    uses: ./.github/workflows/ember-live-services-run.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Pass the variable as a workflow secret so the runner masks its value.
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY || vars.BRAVE_SEARCH_API_KEY }}
