name: Ember Live Service Smoke

on:
  push:
    branches: [codex/ember-routing-v4]
    paths:
      - tool_assistant/live_services.py
      - tool_assistant/live_smoke.py
      - tests/test_live_services.py
      - .github/workflows/ember-live-services.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install huggingface-hub==1.31.0 sentencepiece==0.2.0 numpy==2.2.6 pytest==8.3.5
      - name: Check service contracts and injected failures offline
        run: python -m pytest -q tests/test_live_services.py
      - name: Reproduce original frozen checkpoints
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m tool_assistant.build --out baseline-candidate | tee baseline-build.log
      - name: Reproduce v4 control
        run: python -m tool_assistant.build_v4 --base baseline-candidate --out routing-v4-candidate | tee v4-build.log
      - name: Reproduce frozen v5 helper
        run: python -m tool_assistant.build_v5 --base routing-v4-candidate --out routing-v5-candidate | tee v5-build.log
      - name: Measure live services on both checkpoint integrations
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python -m tool_assistant.live_smoke --bundle routing-v5-candidate --report evidence/live-services-smoke.json | tee live-services.log
      - name: Preserve live evidence including failures and unavailable services
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-live-services-${{ github.run_id }}
          path: |
            evidence/
            live-services.log
            *-build.log
            routing-v5-candidate/manifest.json
          retention-days: 90
