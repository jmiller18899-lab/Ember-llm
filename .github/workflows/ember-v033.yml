name: Ember v0.0.33 CPU Copy Replay

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded CPU copy-replay canary
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, canary]
  push:
    branches: [codex/ember-v033-copy-replay]
    paths: [.github/ember-v033.trigger]

permissions:
  contents: read

concurrency:
  group: ember-v033-copy-replay
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Resolve mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode="$REQUESTED_MODE"
          else
            mode="$(awk -F: '/^mode:/ {gsub(/[[:space:]]/, "", $2); print $2}' .github/ember-v033.trigger)"
          fi
          case "$mode" in
            bootstrap|canary) ;;
            *) echo 'Unsupported v0.0.33 mode'; exit 1 ;;
          esac
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.value != 'bootstrap'
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        if: steps.mode.outputs.value != 'bootstrap'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install huggingface-hub==1.30.0 sentencepiece==0.2.0 jsonschema==4.23.0 pytest==8.3.5 trackio==0.37.1 numpy==2.2.6
      - name: Test replay training, checkpoint evidence, and unchanged gates
        if: steps.mode.outputs.value != 'bootstrap'
        run: python -m pytest -q tests/test_ember_v033_replay.py tests/test_ember_v032_learning.py tests/test_ember_semantic_data.py tests/test_ember_semantic_gate.py
      - name: Run one bounded CPU canary and save checkpoint copy checks
        if: steps.mode.outputs.value != 'bootstrap'
        env:
          HF_TOKEN: ${{ secrets.H_F2 }}
          CUDA_VISIBLE_DEVICES: ''
        run: python jobs/ember_semantic_canary_v033.py --output-dir v033-results
      - name: Show measured outcome and checkpoint copy results
        if: always() && steps.mode.outputs.value != 'bootstrap'
        run: |
          if [ -f v033-results/summary.md ]; then
            cat v033-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The CPU canary stopped before a summary was saved. Check the failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve CPU evidence
        if: always() && steps.mode.outputs.value != 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: ember-v033-replay-${{ github.run_id }}
          path: |
            v033-results/report.json
            v033-results/checkpoint-reports.json
            v033-results/history.json
            v033-results/identity.json
            v033-results/config.json
            v033-results/publication.json
            v033-results/summary.md
          if-no-files-found: warn
          retention-days: 90
