name: Ember v0.0.8 One-Time Launch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ember-v008-launch-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ember-v008-paid-training
  cancel-in-progress: false

jobs:
  gate-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pinned Ember main
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face Jobs client
        run: python -m pip install --upgrade "huggingface-hub>=1.4"

      - name: Verify private Hub write access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python jobs/ember_hf_bootstrap.py

      - name: Run corrected v0.0.7 baseline gate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run \
            --name ember-v0-0-7-baseline-eval-fixed \
            --flavor cpu-upgrade \
            --timeout 2h \
            --secrets HF_TOKEN \
            jobs/ember_hf_eval.py -- \
            --model-name ember-v0.0.7-t4 \
            --label baseline-v0.0.7-fixed

      - name: Submit one approved v0.0.8 T4 run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf jobs uv run --detach \
            --name ember-v0-0-8-t4-long \
            --flavor t4-small \
            --timeout 3h \
            --secrets HF_TOKEN \
            jobs/ember_hf_train_v008.py
